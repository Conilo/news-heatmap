name: Live Fetch Tests

on:
  pull_request:
    paths:
      - src/fetch.py

jobs:
  live-fetch-tests:
    name: Live Fetch Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run live fetch tests
        run: pytest --live
